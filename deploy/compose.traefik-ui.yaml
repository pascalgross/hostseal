# Optional: a second hostname for the interface, with a certificate a browser trusts.
#
#   docker compose -f compose.yaml -f compose.traefik.yaml -f compose.traefik-ui.yaml up -d
#
# Stacked on top of compose.traefik.yaml rather than folded into it, because the two answer different
# questions. That file routes agents, and needs nothing from Traefik but SNI. This one asks Traefik to
# obtain a certificate and terminate TLS, which needs a certificate resolver and the ServersTransport in
# traefik/dynamic/hostseal.yml — prerequisites that live in your Traefik rather than here.
#
# The split that makes this work is that **agents do not need a publicly trusted certificate at all**.
# An agent verifies the control plane against the CA bundle it was handed at enrolment, so the agent
# hostname keeps the passthrough router and the server's own certificate, and Let's Encrypt is applied
# to exactly the audience that benefits from it: browsers.
#
#   ${HOSTSEAL_AGENT_HOSTNAME}  TCP router, passthrough    → agents, mTLS end to end
#   ${HOSTSEAL_UI_HOSTNAME}     HTTP router, ACME          → operators, in a browser
#
# The two must be different names. One hostname cannot be both: a TCP router whose HostSNI matches wins
# the connection before any HTTP router sees it, so the interface would simply never be reached.
#
# In your Traefik, once:
#
#   docker compose cp hostseal-server:/var/lib/hostseal-server/ca/ca.crt ./hostseal-ca.crt
#   # then mount ./hostseal-ca.crt at /etc/traefik/hostseal-ca.crt and traefik/dynamic/hostseal.yml into
#   # the directory Traefik watches. See README.md.

services:
  hostseal-server:
    labels:
      traefik.http.routers.hostseal-ui.rule: Host(`${HOSTSEAL_UI_HOSTNAME:?set HOSTSEAL_UI_HOSTNAME in .env}`)
      traefik.http.routers.hostseal-ui.entrypoints: ${HOSTSEAL_TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.hostseal-ui.tls: "true"
      # Whatever your Traefik calls its ACME resolver. Traefik obtains and renews the certificate for
      # this hostname on its own, and nothing about it reaches hostseal-server — which is the reason to
      # prefer this shape over feeding a certificate into the container: the server reads --tls-cert
      # once, at startup, so a renewal there would need a restart every sixty days.
      traefik.http.routers.hostseal-ui.tls.certresolver: ${HOSTSEAL_CERT_RESOLVER:-letsencrypt}
      traefik.http.services.hostseal-ui.loadbalancer.server.port: "8443"
      # https, because hostseal-server serves nothing else: client certificates require TLS, so it
      # refuses to start without one rather than offering a plaintext port a proxy could use.
      traefik.http.services.hostseal-ui.loadbalancer.server.scheme: https
      # Defined in traefik/dynamic/hostseal.yml — a label cannot declare a ServersTransport. Without it
      # this leg is either unverified or fails on the hostname, because the server's certificate names
      # localhost rather than the public name Traefik was reached at.
      traefik.http.services.hostseal-ui.loadbalancer.serverstransport: hostseal@file

      # The agent protocol is refused on this hostname, at the proxy, before it reaches the server.
      #
      # It would be refused anyway: these endpoints demand a client certificate, and TLS terminated at
      # Traefik cannot carry one, so an agent pointed here gets 401 on every request. Making it a 403
      # from the proxy instead is worth three lines because of what it removes rather than what it
      # says — this hostname now has no path to the agent API at all, so no future middleware, header
      # or misconfiguration on it can become one. The agent hostname is unaffected: it is a TCP router
      # and never sees an HTTP rule.
      #
      # Neither router sets a priority, and that is what makes this one win.
      #
      # Both match this hostname, so one has to outrank the other, and Traefik's default rank is the
      # length of the rule. This router's rule is the other one's rule plus ` && PathPrefix(`/agent`)`,
      # so it is strictly longer for every hostname there can ever be — which is a property of the two
      # strings rather than a number somebody has to keep ahead of.
      #
      # It used to say `priority: "100"`, and that was a bug of exactly the shape this repository tries
      # not to ship: plausible, quiet, and wrong only at the edge. A fixed priority does not stop the
      # *other* router computing its own from its rule length, and a DNS name may be 253 characters, so
      # a UI hostname of about ninety pushed `Host(`…`)` past 100 and the deny router silently stopped
      # applying. Nothing would have looked broken; the belt-and-braces layer would just have been gone.
      traefik.http.routers.hostseal-ui-no-agents.rule: Host(`${HOSTSEAL_UI_HOSTNAME:?set HOSTSEAL_UI_HOSTNAME in .env}`) && PathPrefix(`/agent`)
      traefik.http.routers.hostseal-ui-no-agents.entrypoints: ${HOSTSEAL_TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.hostseal-ui-no-agents.tls: "true"
      traefik.http.routers.hostseal-ui-no-agents.tls.certresolver: ${HOSTSEAL_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.hostseal-ui-no-agents.service: hostseal-ui
      traefik.http.routers.hostseal-ui-no-agents.middlewares: hostseal-no-agents
      # An allow-list of one address that is never the source of a proxied request. Traefik has no
      # "deny" middleware, and this is the idiomatic way to spell one: every request through this
      # router is answered 403 without reaching a back end.
      traefik.http.middlewares.hostseal-no-agents.ipallowlist.sourcerange: 127.0.0.1/32

      # Rate limiting for the sign-in endpoint, here rather than in the control plane.
      #
      # hostseal-server limits sign-in attempts per source address, and on this router every browser
      # arrives from Traefik. One bucket for the whole installation would be an availability problem
      # rather than a nuisance: verifying a password is a 64 MiB Argon2id derivation, so the limit is
      # low by necessity, and an unauthenticated client that keeps that one bucket empty stops everybody
      # else signing in.
      #
      # The fix belongs at this layer and only at this layer, because this is the only layer that knows
      # who the client is. The obvious alternative — teach hostseal-server to read X-Forwarded-For from a
      # trusted proxy — is worse here than doing nothing, and the reason is specific to this stack: this
      # overlay is documented as stacking on compose.traefik.yaml, whose TCP router passes TLS straight
      # through. Both legs dial the same container from the same Traefik address, and on the passthrough
      # leg Traefik never parses HTTP, so it cannot strip a header a client set. Trusting the header
      # from Traefik's address would therefore trust it from anybody who reached the agent hostname —
      # turning a shared bucket into no bucket at all, and an unauthenticated password-guessing channel
      # with a fresh allowance per forged value.
      #
      # It rides a router of its own, and that is the half this used to get wrong. The middleware hung
      # on the hostseal-ui router, whose rule is `Host(...)` and nothing else — so a limit written for
      # one password form applied to every request on the hostname: the HTML, each Angular chunk, every
      # asset and the whole of /api/v1. Twenty in a burst is roughly what one cold load of the interface
      # costs, so the allowance was gone before an operator had done anything, and what they got
      # afterwards was one request every six seconds. Traefik's refusal carries no problem document, so
      # the interface could render it only as "The control plane returned 429." — a 429 the control
      # plane never sent, about a limit it does not have.
      #
      # Matching POST /api/v1/session puts the limit back on the derivation it was written for. The
      # router needs no priority, for the reason the deny router above needs none: its rule is the
      # hostseal-ui rule plus two further matchers, so it is strictly longer for every hostname there
      # can ever be. Signing out is a DELETE on the same path and is deliberately outside the match — it
      # costs a row update, not an Argon2id derivation, and an operator who cannot sign out is an
      # operator whose session stays valid.
      traefik.http.routers.hostseal-ui-signin.rule: Host(`${HOSTSEAL_UI_HOSTNAME:?set HOSTSEAL_UI_HOSTNAME in .env}`) && Path(`/api/v1/session`) && Method(`POST`)
      traefik.http.routers.hostseal-ui-signin.entrypoints: ${HOSTSEAL_TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.hostseal-ui-signin.tls: "true"
      traefik.http.routers.hostseal-ui-signin.tls.certresolver: ${HOSTSEAL_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.hostseal-ui-signin.service: hostseal-ui
      traefik.http.routers.hostseal-ui-signin.middlewares: hostseal-ui-signin@docker

      # `sourcecriterion` is the default, the request's real source address as Traefik sees it. Twenty
      # in a burst and ten a minute sustained: a person who has forgotten which password they used will
      # not notice, and a script will.
      traefik.http.middlewares.hostseal-ui-signin.ratelimit.average: "10"
      traefik.http.middlewares.hostseal-ui-signin.ratelimit.period: 1m
      traefik.http.middlewares.hostseal-ui-signin.ratelimit.burst: "20"
