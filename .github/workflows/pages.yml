# The published site: the documentation, and the APT repository beside it.
#
# One workflow deploys Pages, because a Pages deployment replaces the whole site. If the release
# workflow deployed the APT repository and this one deployed the documentation, whichever ran second
# would delete what the first published — and the one it would delete is the repository every host
# updates from.
#
# So the split is by who holds the signing key, not by who deploys. The release workflow signs the
# repository once and publishes it as a release asset; this workflow unpacks that asset beside the
# documentation and deploys both. The key is therefore never present on a push to main, and the
# documentation can be corrected without a release.
name: pages

on:
  # Every push to main, without a paths filter. A filter would save a minute of runner time and cost
  # more than that in confusion: GitHub does not apply path filters to the push that creates a branch,
  # so the first push to a new main silently skips the deployment and the site simply never appears.
  # The job builds one small Go program and unpacks a tarball; it is not worth optimising.
  push:
    branches: [main]
  # After a release, so the newly published repository replaces the one under /apt.
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment in progress. Pages serves whatever finished last, and a cancelled deploy
# during a release is how a site ends up with new documentation and last month's packages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # A release that failed must not republish the site; it would deploy documentation for a version
    # whose packages were never signed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # Named explicitly because setup-go v6 changed the default from go.sum to go.mod. go.mod
          # lists the direct requirements; go.sum carries every transitive hash, which is what an
          # indirect bump moves — so the default would reuse a cache entry built before it.
          cache-dependency-path: go.sum

      - name: Render the documentation
        # Through the Makefile, so that `make site` locally produces what is published.
        run: make site

      - name: Add the signed APT repository
        # Downloaded from the latest release rather than rebuilt, because rebuilding would need the
        # archive signing key on every documentation change. Before the first release there is nothing
        # to fetch and the site publishes without /apt, which is correct: there are no packages yet.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" 2>/dev/null \
            | jq -r '.assets[]? | select(.name == "apt-repository.tar.gz") | .url' || true)
          if [ -z "$asset" ] || [ "$asset" = "null" ]; then
            echo "No published APT repository yet; the site will not carry /apt."
            exit 0
          fi
          mkdir -p public/apt
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$asset" -o /tmp/apt-repository.tar.gz
          tar -xzf /tmp/apt-repository.tar.gz -C public/apt
          echo "Unpacked the published repository:"
          find public/apt -maxdepth 2 -type d | sort

      - name: Check the published repository against this checkout
        # The tree under /apt is only ever replaced by a release, so from the moment the project is
        # renamed until the next one the site serves the previous project's repository: a keyring, a
        # sources file and install instructions naming a domain that has stopped answering, published
        # under the new project's name. Nothing fails to produce that — every workflow here does what
        # it was written to do — so it survives until somebody opens the page in a browser, which is
        # how it was found the first time.
        #
        # A warning and not a failure, and the tree is published either way. The documentation is the
        # half that can be corrected without the signing key, and holding it back would repair
        # nothing; and dropping a mismatched tree would turn a stale `apt-get update` into a broken one
        # for any host already pointing here, which is worse than what it fixes. The repair is a
        # release — docs/MAINTAINING.md §6 — and this step exists to say so unprompted.
        #
        # What it expects is read out of the packaging in this checkout rather than written down here,
        # so the check still holds the next time one of these names changes.
        run: |
          [ -d public/apt ] || exit 0
          sources=$(basename packaging/apt/*.sources.in .in)
          origin=$(sed -n 's/^ORIGIN=${ORIGIN:-\(.*\)}$/\1/p' packaging/apt/mkapt.sh)
          release=$(find public/apt/dists -maxdepth 2 -name Release -print -quit)
          published=$(sed -n 's/^Origin: //p' "${release:-/dev/null}" | head -n 1)
          stale=
          [ -f "public/apt/$sources" ] || stale="carries no $sources"
          if [ -n "$published" ] && [ "$published" != "$origin" ]; then
            stale="${stale:+$stale, and }names Origin: $published rather than $origin"
          fi
          [ -n "$stale" ] || exit 0
          note="The repository unpacked under /apt $stale, so it was built before the packaging in this checkout. It will keep naming the previous project until a release republishes it; see docs/MAINTAINING.md section 6."
          echo "::warning title=The published APT repository is out of date::$note"
          echo "**The published APT repository is out of date.** $note" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        # Turns Pages on if nobody has. The failure mode when it is off is a red deploy at the end of a
        # release, which is the worst moment to discover a setting.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: pages
