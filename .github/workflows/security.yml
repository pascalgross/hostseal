# Vulnerability and secret scanning.
#
# It runs on pull requests and on a schedule, because the interesting failure mode is not "this change
# introduced a vulnerability" but "a vulnerability was published in something we already depend on" —
# and that arrives on somebody else's timetable.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Every day at 05:17 UTC. An odd minute rather than the hour, because GitHub's scheduler queues
    # everything submitted for :00 and a job that runs late every day is one people stop trusting.
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # Named explicitly because setup-go v6 changed the default from go.sum to go.mod. go.mod
          # lists the direct requirements; go.sum carries every transitive hash, which is what an
          # indirect bump moves — so the default would reuse a cache entry built before it.
          cache-dependency-path: go.sum
      - name: Known vulnerabilities in reachable Go code
        # govulncheck reports only vulnerabilities in code paths the binary actually reaches, which is
        # what makes its output worth reading rather than triaging.
        #
        # The one tool here still installed from @latest, and deliberately: its subject is what was
        # published after the last time anybody looked, so a pinned copy is a scanner that stops
        # learning. It also produces nothing that ships — unlike nfpm, whose output every host installs
        # and runs as root, which is why that one is pinned in the Makefile.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Given explicitly, as in ci.yml: there is no package.json at the repository root and no
          # packageManager field for the action to read, so without it the step fails before it starts
          # — which is how this job managed never to have run at all.
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities in the front-end dependency tree
        # High and above fails. Everything below is reported and does not block: a build-time dependency
        # with a moderate advisory is worth knowing about and is not worth stopping a security fix from
        # landing.
        run: pnpm audit --audit-level high

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Filesystem scan
        # Pinned to a release rather than @master. This is the workflow whose subject is supply-chain
        # vigilance; running a third-party action from a moving branch in it would be funny in a way
        # nobody wants to explain.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secrets in the history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
