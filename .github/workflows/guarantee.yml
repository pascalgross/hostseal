# The tests that enforce the guarantee in docs/SECURITY.md §1.
#
# This is a separate workflow from `ci` on purpose, so that it can be a required status check with no
# maintainer override. That setting lives in the repository's branch protection rules rather than in
# this file — a workflow cannot make itself unbypassable — and it is the thing that keeps the guarantee
# true across contributors who never read the design brief, including future maintainers, including us
# on a bad day.
#
# Repository setup, for whoever configures it:
#
#   Settings → Branches → main → Require status checks to pass
#     ✓ guarantee / guarantee
#     ✓ Do not allow bypassing the above settings
#
# If this workflow ever needs to be skipped to land a change, the change is wrong.
name: guarantee

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guarantee:
    name: guarantee
    runs-on: ubuntu-latest
    services:
      # Not optional here, and this workflow ran without one for longer than it should have.
      #
      # The store tests are written to skip when there is no database, so that `go test ./...` works on
      # a laptop — and a skipped test is indistinguishable from a passing one in a summary. Several of
      # the guarantees below are enforced by PostgreSQL and by nothing else: tenant isolation is a
      # row-level security policy, the refusal to release your own job is a condition inside an UPDATE
      # statement, and neither exists in the in-memory store. Without this service the required check
      # ran the in-memory half of each of those and reported success, which is a green check named
      # "guarantee" proving nothing about the mechanism that does the guaranteeing.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hostseal_test
          POSTGRES_PASSWORD: hostseal_test
          POSTGRES_DB: hostseal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hostseal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      HOSTSEAL_TEST_DATABASE_URL: postgres://hostseal_app:hostseal_app@127.0.0.1:5432/hostseal_app?sslmode=disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # Named explicitly because setup-go v6 changed the default from go.sum to go.mod. go.mod
          # lists the direct requirements; go.sum carries every transitive hash, which is what an
          # indirect bump moves — so the default would reuse a cache entry built before it.
          cache-dependency-path: go.sum

      - name: Create a database role that row-level security applies to
        # The postgres image's POSTGRES_USER is the cluster's bootstrap superuser, and a superuser is
        # exempt from every row-level security policy in the schema — with no symptom. Tenant isolation
        # *is* those policies, so tests run as that role cannot observe the thing they exist to observe;
        # TestGuaranteeRowLevelSecurityIsTheRuleNotThePredicate fails rather than skipping in that
        # state, which is how this was found.
        #
        # The bootstrap user cannot drop its own SUPERUSER attribute — PostgreSQL refuses, and that is
        # not a permissions accident but a rule about the bootstrap role. So the tests get an ordinary
        # role of their own, owning its own database. That is also exactly what docs/INSTALL.md tells an
        # operator to do, which means CI now runs against the documented production arrangement rather
        # than a more privileged one.
        env:
          PGPASSWORD: hostseal_test
        run: |
          psql -h 127.0.0.1 -U hostseal_test -d hostseal_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE hostseal_app LOGIN PASSWORD 'hostseal_app';
          CREATE DATABASE hostseal_app OWNER hostseal_app;
          SQL
          PGPASSWORD=hostseal_app psql -h 127.0.0.1 -U hostseal_app -d hostseal_app -tAc \
            'SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = current_user;' \
            | grep -qx f

      - name: The catalogue is exactly the expected set, and nothing reaches a shell
        # Verbose on purpose. When this fails, the output is the first thing a reviewer reads, and the
        # test names and failure messages are written to explain the design rather than the assertion.
        # Through the Makefile, so that the required check and `make guarantee` cannot drift apart.
        run: make guarantee-tests

      - name: The PostgreSQL half of the guarantee suite actually ran
        # The check above passes whether or not the database was reachable, because the store tests
        # skip rather than fail without one. These two names are the ones whose PostgreSQL half is the
        # whole point: the first proves a tenant cannot see another tenant's rows even from a statement
        # with no tenant predicate, which is a row-level security policy and cannot exist in the
        # in-memory store; the second proves a signed job's payload canonicalises to the same bytes
        # after a round trip through jsonb, which is what stands between a correct signature and a host
        # reporting it as a broken key.
        run: |
          go test -count=1 -v ./internal/store/ \
            -run 'TestGuaranteeOneTenantCannotSeeAnother|TestGuaranteeAStoredJobCanonicalisesToWhatWasSigned' \
            | tee /tmp/guarantee-store.log
          for name in \
            '--- PASS: TestGuaranteeOneTenantCannotSeeAnother/postgres' \
            '--- PASS: TestGuaranteeAStoredJobCanonicalisesToWhatWasSigned/postgres'; do
            grep -q -- "$name" /tmp/guarantee-store.log \
              || { echo "the PostgreSQL guarantee tests skipped: $name did not run" >&2; exit 1; }
          done

      - name: Fuzz the parameter decoders and the canonical encoder
        # Sixty seconds each in CI. `make fuzz` runs ten minutes locally, and the corpus a failure
        # produces is worth committing when one ever does.
        run: make guarantee-fuzz

      - name: The catalogue in the binary matches the documentation
        # docs/SECURITY.md lists the intents and the permanently refused names in prose. A build whose
        # catalogue had drifted from the document would make the document a description of an older
        # version, which for this particular document is worse than having none.
        run: |
          go build -o /tmp/hostseal-server ./cmd/hostseal-server
          /tmp/hostseal-server catalogue > /tmp/catalogue.txt
          cat /tmp/catalogue.txt
          for intent in facts.collect packages.listUpgradable services.list reboot.checkRequired \
                        packages.applySecurity packages.applyAll service.start service.stop \
                        service.restart host.reboot; do
            grep -q "^${intent} " /tmp/catalogue.txt \
              || { echo "the binary does not list ${intent}" >&2; exit 1; }
            grep -q "\`${intent}\`" docs/SECURITY.md \
              || { echo "docs/SECURITY.md does not document ${intent}" >&2; exit 1; }
          done
          for refused in shell.exec script.run file.write apt.addRepository user.create \
                         ssh.authorizedKeys.add agent.updateFromURL; do
            grep -q "^  ${refused}$" /tmp/catalogue.txt \
              || { echo "the binary does not list ${refused} as refused" >&2; exit 1; }
            grep -q "\`${refused}\`" docs/SECURITY.md \
              || { echo "docs/SECURITY.md does not explain why ${refused} is refused" >&2; exit 1; }
          done

      - name: The guarantee is stated in full, and word for word
        # The match is the whole sentence rather than a distinctive fragment of it, because a fragment
        # cannot see a qualifier added after it. `grep -q "still cannot run arbitrary code on any"` —
        # what this step used to run — matches "on any enrolled **Linux** host" just as happily, so the
        # one check standing between the project and a quietly narrowed guarantee could not see the
        # narrowing. The paragraph is wrapped across lines and carries blockquote markers, so the file
        # is flattened before comparison: what is pinned is the sentence, not where it wraps.
        run: |
          set -eu
          cat > "$RUNNER_TEMP/guarantee.txt" <<'PARAGRAPH'
          An attacker who fully owns the HostSeal control plane, its database, and an administrator account still cannot run arbitrary code on any **enrolled** host, cannot exceed any host's local policy, and cannot reboot or stop services on hosts whose policy forbids it.
          PARAGRAPH
          for file in README.md docs/SECURITY.md; do
            flat=$(sed -e 's/^[[:space:]]*>[[:space:]]\{0,1\}//' "$file" | tr '\n' ' ' | tr -s '[:space:]' ' ')
            printf '%s' "$flat" | grep -qF -f "$RUNNER_TEMP/guarantee.txt" \
              || { echo "$file does not state the guarantee, word for word" >&2; exit 1; }
          done
          echo "the guarantee is present, word for word, in README.md and docs/SECURITY.md"
