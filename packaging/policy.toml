# HostSeal local policy.
#
# This file is the authority on this host. It is owned root:root, the hostseal agent cannot write it,
# and no operation in HostSeal's intent catalogue can modify it. Effective permission for any job is
# min(what the control plane asked for, what this file allows) — never the maximum. A host set to
# allow = "none" cannot be made to apply updates by anyone in the control plane holding any role,
# ever, including the person who installed it.
#
# It is shipped as a dpkg conffile, so your edits survive package upgrades. If you change it, run
# `hostseal-agent policy check` to validate before restarting the agent: a file that does not parse
# causes the host to refuse all privileged work rather than fall back to a default, which is deliberate
# and is a miserable way to discover a typo.
#
# Full reference: /usr/share/doc/hostseal-agent/SECURITY.md, or docs/SECURITY.md in the source tree.
#
# One file, two platforms. A Windows host reads the same keys, and several of them have nothing to act
# on there: it applies no updates and reboots nothing, so `allow`, `auto_apply`, `reboot`, `window` and
# `[services] restartable` are reported to the control plane and enforced by nothing. That is not an
# oversight — see docs/SECURITY.md section 12.3 for why a Windows host executes only the read tier. The
# keys that do apply there are `scan`, `[services] watched` and `[limits]`. `[resources] report` is read
# on Windows and reported to the control plane, but a Windows host has nothing to put under it: every
# reader behind that key is /proc-based. It is in this file on every host for the same reason `scan` is —
# a key that appeared only in Linux policy files would be one an operator meets during an incident.

[updates]

# How far this host will go in applying package updates.
#
#   none      refuse every update application, from anyone
#   security  apply updates from the distribution's security origins only
#   all       apply every available update
allow = "security"

# Whether this host applies permitted updates on its own timer, without being asked.
#
# This is what keeps a fleet patched through a control-plane outage. It is a separate setting from
# `allow` because the two answer different questions: `allow` bounds what the control plane may ask
# for, `auto_apply` decides whether the host also acts unprompted.
#
# NOT YET IMPLEMENTED. The timer that applies updates unprompted belongs to unattended-upgrades, which
# the distribution configures and HostSeal currently does not touch, so this setting is reported to the
# control plane and acted on by nothing. It is here from the first release because it belongs in this
# file, and because adding a policy key later means every host in a fleet has a policy file older than
# the software reading it.
auto_apply = true

# Whether this host will enumerate its pending updates when asked.
#
# It exists because on Windows the question is not free. On Linux it is `apt-get --just-print`: local,
# milliseconds, changes nothing — so no Linux host has ever needed a way to refuse it, and this key has
# no effect there. A Windows Update scan goes to the network, changes state under %windir% and takes
# minutes, which makes it privileged work wearing a read class; docs/SECURITY.md's own rule for adding an
# intent applies, and every privileged operation must be refusable locally.
#
# It bounds the scan, not the applying. `allow` does that, and the two are independent: a host with
# allow = "none" still has every reason to report what is pending. Refusing to apply an update and
# refusing to look at it are different decisions.
#
# The default is true, unlike [containers] report below, and the difference is defensible. A container
# name describes what a business runs and is a disclosure a host has not agreed to make; a count of
# missing patches is the number this product exists to show, and an operator who installed a fleet agent
# has asked for it. What this key buys them is a way to say no on the hosts where the cost is not worth
# it. A host that says no reports its updates as unmeasured, never as none.
#
# ORDERING WARNING, as for [containers] report: HostSeal refuses a policy file containing a key it does
# not know, and a refused policy file means the host falls closed. Upgrade the agent first, then set the
# key, and run `hostseal-agent policy check` before restarting anything.
scan = true

# The maintenance window, in the timezone below. Empty means any time.
#
# Accepted forms:
#   ""                      always open
#   "Sun 03:00-05:00"       one day
#   "Mon-Fri 02:00-04:00"   a range of days
#   "Sat,Sun 00:00-06:00"   a list of days
#   "Sat 22:00-02:00"       crossing midnight, into Sunday morning
#   "daily 03:00-05:00"     every day
#   "daily 00:00-00:00"     open all day, written out — which is what updates.reboot = "window" needs,
#                           because it refuses an empty window
#
# A range that opens and closes at any other identical time is refused rather than accepted. "Sun
# 03:00-03:00" reads as a narrow Sunday slot and would mean the twenty-four hours from Sunday 03:00 to
# Monday 03:00, which is not a window anybody has ever meant to write.
window = ""

# The IANA timezone the window above is expressed in.
#
# It is explicit rather than inherited from the host clock, because in a fleet spanning regions
# "03:00" silently meaning two different hours on two hosts is discovered during the outage rather
# than before it.
timezone = "UTC"

# Whether and when this host will reboot on request.
#
#   never   refuse every reboot request
#   window  reboot only inside the maintenance window above
#
# "window" requires `window` above to be set. An empty window is always open, so the combination would
# mean "reboot at any time" — which is not what anybody writing `reboot = "window"` meant, and is the
# sort of thing discovered by a host rebooting at eleven on a Tuesday morning. There is deliberately no
# `reboot = "always"`: if you really want that, say so in the window.
#
# The shipped default is "never". A fresh install should be able to report on a host and keep it
# patched, and should be able to do nothing else until somebody decides otherwise.
reboot = "never"

[services]

# Units this host will start, stop or restart on request.
#
# Entries are matched with shell-style globbing, so "hostseal-*.service" covers instances without
# enumerating them. The shipped default is empty: nothing is restartable until you say what is.
#
# Example:
#   restartable = ["nginx.service", "docker.service", "hostseal-*.service"]
restartable = []

# Units whose state changes this host considers worth reporting as an event.
#
# Matched the same way as `restartable`, and deliberately with the opposite default: empty means
# *every* unit. Permitting an action and reporting a fact are different questions, and a fresh host
# should surface a failed unit rather than hide it behind a setting nobody has heard of.
#
# Write a list when the noise is not worth it — a machine whose timers fail routinely, say — and the
# host will keep quiet about everything else. It bounds what the control plane says about this host,
# never what may be done to it, so widening it is not a permission change. The full unit list still
# rides the heartbeat either way; this decides what becomes an event.
#
# Example:
#   watched = ["nginx.service", "postgresql*.service"]
watched = []

[containers]

# Whether this host reports the containers running on it.
#
# The agent reads /proc and /sys/fs/cgroup as the unprivileged hostseal user. It is never added to the
# docker group and never talks to /var/run/docker.sock: Docker socket access is root equivalence, and
# a fleet agent that held it would undo the rest of this file. That also bounds the answer — no image
# names, no exit codes, no restart counts, and a container that has exited is not visible at all.
#
# What you do get is what is running, what it is using, and the four facts that are the reason this
# exists: which containers run as root, which hold the full capability set, which have no seccomp
# filter, and which have the Docker socket bind-mounted into them.
#
# THE SHIPPED DEFAULT IS false, and that is a decision rather than caution. Container names describe
# what a business runs, and this is a disclosure a host makes to a control plane it may not own. A
# machine willing to report its package state has not thereby agreed to report that, so the answer to
# a question nobody has been asked is no. (The executable name is reported; the command line
# deliberately is not, because an argument vector is where credentials end up.)
#
# Turning it on also costs bandwidth: the memory and CPU figures change every time they are read, so
# this host will send a full report on every heartbeat instead of a digest.
#
# ORDERING WARNING. HostSeal refuses a policy file containing a key it does not know, and a refused
# policy file means the host falls closed — allow = "none", nothing restartable, every privileged job
# refused. Writing this key on a host whose hostseal-agent predates it therefore switches that host's
# updates off until the agent is upgraded or the key is removed. Upgrade the agent first, then set the
# key, and run `hostseal-agent policy check` before restarting anything.
report = false

[resources]

# Whether this host reports its capacity and how much of it is in use.
#
# The agent reads /proc and asks the kernel how full each mounted filesystem is, as the unprivileged
# hostseal user. No socket, no helper, no new privilege — the same reading any account on this machine
# could do. What you get is the pair of questions a fleet tool is asked at three in the morning and could
# not previously answer: which machine is about to run out of disk, and which one is not keeping up.
#
# It reports: each real filesystem with its size, how full it is and how many inodes are gone; total
# memory and swap and how much of each is spoken for; the processor count and the one-minute load average
# as a percentage of it; and per-interface traffic, errors and drops since boot. Interface names, MTUs,
# IP and MAC addresses are in the network section, which is separate and is not gated.
#
# THE SHIPPED DEFAULT IS true, which is the opposite of [containers] report below. The difference is the
# same one `scan` draws: a container name describes what a business runs and is a disclosure a host has
# not agreed to make, while a disk at ninety-eight per cent is the fleet health somebody installed this
# agent to see. What this key buys you is the last word on the hosts where it is nobody else's business.
#
# Two things it is worth knowing before turning it off. Mount points are host filesystem layout, and if
# that is what you object to, this is the key. And every figure in the section is banded — load and memory
# to five percentage points, disks to one, traffic to whole gibibytes — so that a host whose state has not
# changed produces an identical report and keeps sending a digest instead of a full one. A busy host still
# crosses a band often enough to send full reports, so on a metered link this key is also the bill. The
# per-interface error and drop counters are the one exception to the banding and are reported exactly,
# because the whole value of those numbers is whether they are moving — which does mean an interface
# dropping the odd unwanted multicast frame is enough to keep a host sending full reports.
#
# What it cannot see is what the agent's own sandbox hides from it. ProtectHome= and PrivateTmp= in the
# agent's systemd unit replace /home, /root, /tmp and /var/tmp with empty filesystems inside the agent's
# mount namespace, so a separate /home partition is not in this report. The report names those paths in
# words rather than leaving you to notice a missing disk.
#
# ORDERING WARNING, as for the two keys above: HostSeal refuses a policy file containing a key it does not
# know, and a refused policy file means the host falls closed. Writing this key on a host whose
# hostseal-agent predates it switches that host's updates off until the agent is upgraded or the key is
# removed. Upgrade the agent first, then set the key, and run `hostseal-agent policy check` before
# restarting anything. Leaving it out entirely is safe on every version: an absent key means true.
report = true

[limits]

# How long after issue a job may still be executed.
#
# It bounds the damage of a job that sat in a queue across an outage: a restart signed on Tuesday
# should not execute on Friday because this host was offline in between. It is enforced here, locally,
# so that it holds even when the control plane is the thing that went wrong.
max_job_age_seconds = 900
